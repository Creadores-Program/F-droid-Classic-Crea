name: BuildCI

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      simulate_release:
        description: '¿Simulate a release event?'
        type: boolean
        default: false

jobs:
  build-modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Perms Gradle
        run: chmod 777 gradlew

      - name: Set Key
        run: echo "${{ secrets.CREAFDKEYAPPB }}" | base64 -d > app/CreaFD.keystore

      - name: Build App (Modern)
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.simulate_release }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Rename Modern Release APK
        if: github.event_name == 'release' || inputs.simulate_release
        run: |
          cd app/build/outputs/apk/release/
          for f in *.apk; do mv "$f" "${f%.apk}-modern.apk"; done

      - name: Upload APK artifact (Modern)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ (github.event_name == 'release' || inputs.simulate_release) && 'CreaFDroidApp-Modern-Release' || 'CreaFDroidApp-Modern-Debug' }}
          path: ${{ (github.event_name == 'release' || inputs.simulate_release) && 'app/build/outputs/apk/release/*.apk' || 'app/build/outputs/apk/debug/*.apk' }}

  build-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sdk9
          submodules: true
      - name: Set up JDK 8 (For Legacy Gradle)
        id: setup-jdk8
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 8
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install 32-bit libraries for legacy AAPT
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            libc6:i386 \
            lib32z1 \
            lib32stdc++6 \
            libstdc++6:i386 \
            libncurses6:i386 \
            libtinfo6:i386
          sudo ln -sf /lib/i386-linux-gnu/libtinfo.so.6 /lib/i386-linux-gnu/libtinfo.so.5 || true
          sudo ln -sf /lib/i386-linux-gnu/libncurses.so.6 /lib/i386-linux-gnu/libncurses.so.5 || true
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android Build-Tools 23.0.3
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;23.0.3" "platforms;android-23"
      - name: Fix missing proguard-android.txt
        run: |
          mkdir -p $ANDROID_HOME/tools/proguard
          cat << 'EOF' > $ANDROID_HOME/tools/proguard/proguard-android.txt
          # Standard Android ProGuard rules
          -dontusemixedcaseclassnames
          -dontskipnonpubliclibraryclasses
          -verbose
          -dontoptimize
          -dontpreverify

          -keepattributes *Annotation*
          -keep public class com.google.vending.licensing.ILicensingService
          -keep public class com.android.vending.licensing.ILicensingService

          -keepclasseswithmembernames class * {
              native <methods>;
          }

          -keepclassmembers class * extends android.app.Activity {
             public void *(android.view.View);
          }

          -keepclassmembers enum * {
              public static **[] values();
              public static ** valueOf(java.lang.String);
          }

          -keep class * implements android.os.Parcelable {
            public static final android.os.Parcelable$Creator *;
          }

          -keepclassmembers class **.R$* {
              public static <fields>;
          }

          -dontwarn android.support.**
          EOF
      - name: Perms Gradle
        run: chmod 777 gradlew
      - name: Set Key
        run: echo "${{ secrets.CREAFDKEYAPPB }}" | base64 -d > app/CreaFD.keystore
      - name: Build App (Legacy)
        env:
          JAVA_HOME: ${{ steps.setup-jdk8.outputs.path }}
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.simulate_release }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Rename Legacy Release APK
        if: github.event_name == 'release' || inputs.simulate_release
        run: |
          cd app/build/outputs/apk/release/
          for f in *.apk; do mv "$f" "${f%.apk}-legacy.apk"; done

      - name: Upload APK artifact (Legacy)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ (github.event_name == 'release' || inputs.simulate_release) && 'CreaFDroidApp-Legacy-Release' || 'CreaFDroidApp-Legacy-Debug' }}
          path: ${{ (github.event_name == 'release' || inputs.simulate_release) && 'app/build/outputs/apk/release/*.apk' || 'app/build/outputs/apk/debug/*.apk' }}

  publish-release:
    if: github.event_name == 'release' || inputs.simulate_release
    needs: [build-modern, build-legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Modern Release APK
        uses: actions/download-artifact@v4
        with:
          name: CreaFDroidApp-Modern-Release
          path: release-apks/modern

      - name: Download Legacy Release APK
        uses: actions/download-artifact@v4
        with:
          name: CreaFDroidApp-Legacy-Release
          path: release-apks/legacy

      - name: Attach Both APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-apks/modern/*.apk
            release-apks/legacy/*.apk

      - name: Sync FDroid Repo
        if: github.event_name == 'release'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.FDROID_SYNC }}
          repository: Creadores-Program/CreaProFDR
          event-type: app_updated
